
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090c">
  <title>Celio</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08090c;
      color: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 380px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: #0a84ff;
      font-size: 25px;
      font-weight: 600;
    }

    .brand-name {
      font-size: 27px;
      font-weight: 650;
      letter-spacing: -1px;
    }

    .subtitle {
      color: #9298a5;
      font-size: 14px;
      margin-top: 4px;
    }

    .panel {
      background: #111318;
      border: 1px solid #262a33;
      border-radius: 18px;
      padding: 24px;
    }

    h1 {
      font-size: 23px;
      letter-spacing: -0.6px;
      margin: 0 0 8px;
    }

    .description {
      color: #9298a5;
      font-size: 14px;
      line-height: 1.5;
      margin: 0 0 26px;
    }

    label {
      display: block;
      color: #9298a5;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.8px;
      margin-bottom: 9px;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 13px;
      background: #0b0d12;
      border: 1px solid #262a33;
      border-radius: 10px;
      color: #f5f6f8;
      font: inherit;
      outline: none;
      margin-bottom: 19px;
    }

    input:focus {
      border-color: #0a84ff;
    }

    button {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 10px;
      background: #0a84ff;
      color: white;
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      background: #3195ff;
    }

    .switch {
      margin-top: 22px;
      text-align: center;
      color: #9298a5;
      font-size: 13px;
    }

    .switch button {
      width: auto;
      height: auto;
      padding: 0;
      background: none;
      color: #0a84ff;
      font-size: inherit;
      font-weight: 500;
    }

    .switch button:hover {
      color: #3195ff;
    }

    .notice {
      margin-top: 18px;
      color: #9298a5;
      text-align: center;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="brand">
      <div class="logo">c</div>
      <div>
        <div class="brand-name">Celio</div>
        <div class="subtitle">Messaging, made personal.</div>
      </div>
    </header>

    <section class="panel">
      <h1 id="heading">Create your account</h1>
      <p class="description" id="description">
        Join Celio and start messaging your friends.
      </p>

      <form id="auth-form">
        <label for="name">NAME</label>
        <input
          id="name"
          name="name"
          type="text"
          placeholder="Choose a username"
          maxlength="24"
          autocomplete="username"
          required
        >

        <label for="password">PASSWORD</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="Create a password"
          minlength="8"
          autocomplete="new-password"
          required
        >

        <button type="submit" id="submit-button">
          Create Account
        </button>
      </form>

      <div class="switch">
        <span id="switch-text">Already have an account?</span>
        <button type="button" id="switch-button">Sign in</button>
      </div>

      <p class="notice" id="notice" role="status">
        Create your account to get started.
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("auth-form");
    const heading = document.getElementById("heading");
    const description = document.getElementById("description");
    const submitButton = document.getElementById("submit-button");
    const switchText = document.getElementById("switch-text");
    const switchButton = document.getElementById("switch-button");
    const password = document.getElementById("password");
    const notice = document.getElementById("notice");

    let signingIn = false;

    switchButton.addEventListener("click", () => {
      signingIn = !signingIn;

      heading.textContent = signingIn
        ? "Welcome back"
        : "Create your account";

      description.textContent = signingIn
        ? "Sign in to continue to your messages."
        : "Join Celio and start messaging your friends.";

      submitButton.textContent = signingIn
        ? "Sign In"
        : "Create Account";

      switchText.textContent = signingIn
        ? "New to Celio?"
        : "Already have an account?";

      switchButton.textContent = signingIn
        ? "Create account"
        : "Sign in";

      password.autocomplete = signingIn
        ? "current-password"
        : "new-password";

      notice.textContent = "Authentication will be connected next.";
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      notice.textContent =
        "The account system isn't connected yet. That comes next.";
    });
  </script>
</body>
</html>
