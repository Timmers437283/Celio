
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090c">
  <title>Celio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090c;
      color: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .panel {
      padding: 32px;
      background: #111318;
      border: 1px solid #262a33;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #9298a5;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.7px;
    }

    input {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #292d36;
      border-radius: 0;
      outline: none;
      background: #0b0d12;
      color: #f5f6f8;
      font: inherit;
      font-size: 14px;
    }

    input::placeholder {
      color: #666c78;
    }

    input:focus {
      border-color: #0a84ff;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .submit {
      width: 100%;
      height: 48px;
      margin-top: 2px;
      border: 0;
      border-radius: 0;
      background: #0a84ff;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .submit:hover {
      background: #168cff;
    }

    .submit:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .switch {
      margin-top: 22px;
      text-align: center;
      color: #9298a5;
      font-size: 13px;
    }

    .switch button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #0a84ff;
      font-size: inherit;
    }

    .notice {
      margin: 16px 0 0;
      color: #9298a5;
      text-align: center;
      font-size: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .notice.error {
      color: #ff6961;
    }

    .notice strong {
      color: #f5f6f8;
      font-size: 16px;
      font-weight: 600;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .panel {
        padding: 24px;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="panel">
      <h1 id="heading">Create account</h1>

      <form id="auth-form">
        <div class="field">
          <label for="name">USERNAME</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your username"
            minlength="3"
            maxlength="20"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            minlength="8"
            maxlength="72"
            autocomplete="new-password"
            required
          >
        </div>

        <button class="submit" id="submit-button" type="submit">
          Create account
        </button>
      </form>

      <div class="switch">
        <span id="switch-text">Already have an account?</span>
        <button type="button" id="switch-button">Sign in</button>
      </div>

      <p class="notice" id="notice" role="status" aria-live="polite" hidden></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://grwomhavguicvwpguvyk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_M4wWQwe4v_d4TyS0OcJblQ_7bsdudPG";

    const form = document.getElementById("auth-form");
    const nameInput = document.getElementById("name");
    const passwordInput = document.getElementById("password");
    const heading = document.getElementById("heading");
    const submitButton = document.getElementById("submit-button");
    const switchText = document.getElementById("switch-text");
    const switchButton = document.getElementById("switch-button");
    const notice = document.getElementById("notice");

    let signingIn = false;

    const client = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    function showNotice(message, isError = false) {
      notice.replaceChildren();
      notice.textContent = message;
      notice.classList.toggle("error", isError);
      notice.hidden = false;
    }

    function showAccount(username, phoneNumber, message) {
      notice.replaceChildren();

      const description = document.createElement("span");
      description.textContent = message;

      const lineBreak = document.createElement("br");

      const number = document.createElement("strong");
      number.textContent = phoneNumber || "Number unavailable";

      notice.append(description, lineBreak, number);
      notice.classList.remove("error");
      notice.hidden = false;
    }

    function friendlyError(error, fallback) {
      const message = error?.message || "";

      if (/failed to fetch|networkerror/i.test(message)) {
        return "Couldn't connect to Supabase. Check your connection and try again.";
      }

      if (/invalid login credentials/i.test(message)) {
        return "Incorrect username or password.";
      }

      if (/username.*taken|already registered|already exists/i.test(message)) {
        return "That username is already taken.";
      }

      if (/email rate limit exceeded/i.test(message)) {
        return "Supabase's email rate limit was reached. Please wait before trying again.";
      }

      if (/invalid jwt|missing authorization header/i.test(message)) {
        return "Supabase rejected the function request. Check the celio-auth function's JWT verification settings.";
      }

      return message || fallback;
    }

    switchButton.addEventListener("click", () => {
      signingIn = !signingIn;

      heading.textContent = signingIn ? "Sign in" : "Create account";
      submitButton.textContent = signingIn ? "Sign in" : "Create account";

      switchText.textContent = signingIn
        ? "Don't have an account?"
        : "Already have an account?";

      switchButton.textContent = signingIn
        ? "Create account"
        : "Sign in";

      passwordInput.autocomplete = signingIn
        ? "current-password"
        : "new-password";

      passwordInput.minLength = signingIn ? 1 : 8;
      notice.hidden = true;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!client) {
        showNotice("The Supabase library did not load. Refresh the page and try again.", true);
        return;
      }

      const username = nameInput.value.trim();
      const password = passwordInput.value;

      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) {
        showNotice(
          "Use 3–20 characters: letters, numbers, or underscores.",
          true
        );
        return;
      }

      if (password.length < 8 || password.length > 72) {
        showNotice("Your password must be between 8 and 72 characters.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = signingIn ? "Signing in..." : "Creating account...";
      notice.hidden = true;

      try {
        const email = username.toLowerCase() + "@celio.app";

        if (signingIn) {
          const { data, error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) {
            throw error;
          }

          const { data: profile, error: profileError } = await client
            .from("profiles")
            .select("username, phone_number")
            .eq("id", data.user.id)
            .single();

          if (profileError) {
            showNotice(
              "Signed in, but your profile could not be loaded. Check the profiles table policies.",
              true
            );
            return;
          }

          showAccount(
            profile.username,
            profile.phone_number,
            "Signed in successfully."
          );
        } else {
          const { data: result, error: functionError } =
            await client.functions.invoke("celio-auth", {
              body: {
                action: "signup",
                username,
                password
              }
            });

          if (functionError) {
            let detail = functionError.message;

            try {
              const response = functionError.context;
              if (response && typeof response.json === "function") {
                const body = await response.json();
                if (body.error) {
                  detail = body.error;
                }
              }
            } catch {
              // Keep the original function error.
            }

            throw new Error(detail || "Account creation failed.");
          }

          if (!result?.success) {
            throw new Error(result?.error || "Account creation failed.");
          }

          const { data: loginData, error: loginError } =
            await client.auth.signInWithPassword({
              email,
              password
            });

          if (loginError) {
            showAccount(
              username,
              result.phoneNumber,
              "Your account was created. Your Celio number is:"
            );
            return;
          }

          showAccount(
            username,
            result.phoneNumber,
            "Account created successfully. Your Celio number is:"
          );
        }
      } catch (error) {
        showNotice(
          friendlyError(error, "Something went wrong. Please try again."),
          true
        );
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = signingIn ? "Sign in" : "Create account";
      }
    });
  </script>
</body>
</html>
