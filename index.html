
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090c">
  <title>Celio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090c;
      color: #f5f6f8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .panel {
      padding: 32px;
      background: #111318;
      border: 1px solid #262a33;
    }

    h1 {
      margin: 0 0 28px;
      font-size: 25px;
      font-weight: 600;
      letter-spacing: -0.7px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #9298a5;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.7px;
    }

    input {
      display: block;
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1px solid #292d36;
      border-radius: 0;
      outline: none;
      background: #0b0d12;
      color: #f5f6f8;
      font: inherit;
      font-size: 14px;
    }

    input::placeholder {
      color: #666c78;
    }

    input:focus {
      border-color: #0a84ff;
    }

    button {
      cursor: pointer;
      font: inherit;
    }

    .submit {
      width: 100%;
      height: 48px;
      margin-top: 2px;
      border: 0;
      border-radius: 0;
      background: #0a84ff;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .submit:hover {
      background: #168cff;
    }

    .submit:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .switch {
      margin-top: 22px;
      text-align: center;
      color: #9298a5;
      font-size: 13px;
    }

    .switch button {
      padding: 0;
      border: 0;
      background: transparent;
      color: #0a84ff;
      font-size: inherit;
    }

    .notice {
      margin: 16px 0 0;
      color: #9298a5;
      text-align: center;
      font-size: 12px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .notice.error {
      color: #ff6961;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      body {
        padding: 16px;
      }

      .panel {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="panel">
      <h1 id="heading">Create account</h1>

      <form id="auth-form">
        <div class="field">
          <label for="name">USERNAME</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Enter your username"
            maxlength="24"
            autocomplete="username"
            required
          >
        </div>

        <div class="field">
          <label for="password">PASSWORD</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            minlength="8"
            autocomplete="new-password"
            required
          >
        </div>

        <button class="submit" id="submit-button" type="submit">
          Create account
        </button>
      </form>

      <div class="switch">
        <span id="switch-text">Already have an account?</span>
        <button type="button" id="switch-button">Sign in</button>
      </div>

      <p class="notice" id="notice" role="status" hidden></p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://grwomhavguicvwpguvyk.supabase.co";
    const SUPABASE_KEY = "sb_publishable_M4wWQwe4v_d4TyS0OcJblQ_7bsdudPG";

    const form = document.getElementById("auth-form");
    const nameInput = document.getElementById("name");
    const passwordInput = document.getElementById("password");
    const heading = document.getElementById("heading");
    const submitButton = document.getElementById("submit-button");
    const switchText = document.getElementById("switch-text");
    const switchButton = document.getElementById("switch-button");
    const notice = document.getElementById("notice");

    let signingIn = false;

    function showNotice(message, isError = false) {
      notice.textContent = message;
      notice.classList.toggle("error", isError);
      notice.hidden = false;
    }

    switchButton.addEventListener("click", () => {
      signingIn = !signingIn;

      heading.textContent = signingIn ? "Sign in" : "Create account";
      submitButton.textContent = signingIn ? "Sign in" : "Create account";

      switchText.textContent = signingIn
        ? "Don't have an account?"
        : "Already have an account?";

      switchButton.textContent = signingIn
        ? "Create account"
        : "Sign in";

      passwordInput.autocomplete = signingIn
        ? "current-password"
        : "new-password";

      passwordInput.minLength = signingIn ? 1 : 8;
      notice.hidden = true;
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const username = nameInput.value.trim();
      const password = passwordInput.value;

      if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
        showNotice(
          "Use 3–24 characters: letters, numbers, or underscores.",
          true
        );
        return;
      }

      if (!signingIn && password.length < 8) {
        showNotice("Your password must be at least 8 characters.", true);
        return;
      }

      if (
        SUPABASE_URL === "PASTE_YOUR_PROJECT_URL" ||
        SUPABASE_KEY === "PASTE_YOUR_PUBLISHABLE_KEY"
      ) {
        showNotice("Add your Supabase URL and publishable key first.", true);
        return;
      }

      if (!window.supabase) {
        showNotice("Couldn't load the authentication library. Refresh and try again.", true);
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = signingIn ? "Signing in..." : "Creating account...";
      notice.hidden = true;

      try {
        const client = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_KEY
        );

        const email = username.toLowerCase() + "@celio.app";

        if (signingIn) {
          const { error } = await client.auth.signInWithPassword({
            email,
            password
          });

          if (error) throw error;

          showNotice("Signed in successfully. Your account is connected.");
        } else {
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: {
                username
              }
            }
          });

          if (error) throw error;

          if (data.session) {
            showNotice("Account created successfully. Next, we'll assign your Celio number.");
          } else {
            showNotice("Account created. Supabase requires email confirmation before you can sign in. We'll configure this next.");
          }
        }
      } catch (error) {
        if (error.message?.toLowerCase().includes("fetch")) {
          showNotice("Couldn't connect. Check your Supabase URL and publishable key.", true);
        } else {
          showNotice(error.message || "Something went wrong. Try again.", true);
        }
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = signingIn ? "Sign in" : "Create account";
      }
    });
  </script>
</body>
</html>
