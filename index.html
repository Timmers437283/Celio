
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0c0c">
  <title>Celio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --background: rgb(12, 12, 12);
      --border: #292929;
      --text: #f5f5f5;
      --muted: #929292;
      --blue: #1684ff;
      --blue-hover: #3294ff;
      --input: #0e0e0e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--background);
      color: var(--text);
      font-family: "Google Sans", Arial, sans-serif;
      font-weight: 500;
      -webkit-font-smoothing: antialiased;
    }

    .auth {
      width: 100%;
      max-width: 390px;
      animation: appear 180ms ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: 29px;
      font-weight: 500;
      letter-spacing: -0.8px;
      text-align: center;
      margin-bottom: 9px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      font-weight: 400;
      text-align: center;
      margin-bottom: 34px;
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 9px;
      font-size: 13px;
      color: #dedede;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      font-weight: 400;
      outline: none;
      transition: border-color 150ms ease;
    }

    input::placeholder {
      color: #686868;
    }

    input:hover {
      border-color: #414141;
    }

    input:focus {
      border-color: var(--blue);
    }

    .password-input {
      padding-right: 64px;
    }

    .show-password {
      position: absolute;
      top: 0;
      right: 0;
      height: 50px;
      padding: 0 14px;
      background: transparent;
      border: none;
      color: #a0a0a0;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
    }

    .show-password:hover {
      color: white;
    }

    .primary-button {
      width: 100%;
      height: 49px;
      margin-top: 5px;
      border: 1px solid var(--blue);
      border-radius: 5px;
      background: var(--blue);
      color: white;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .primary-button:hover {
      background: var(--blue-hover);
      border-color: var(--blue-hover);
    }

    .primary-button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    button:focus-visible {
      outline: 2px solid white;
      outline-offset: 3px;
    }

    .message {
      min-height: 18px;
      margin-top: 14px;
      color: #f08c8c;
      font-size: 12px;
      font-weight: 400;
      text-align: center;
    }

    .switch {
      margin-top: 14px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }

    .text-button {
      background: none;
      border: none;
      padding: 0;
      margin-left: 3px;
      color: var(--blue);
      font-family: inherit;
      font-size: inherit;
      font-weight: 500;
      cursor: pointer;
    }

    .text-button:hover {
      color: var(--blue-hover);
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      .auth {
        max-width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="auth">
    <section id="loginScreen">
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account</p>

      <form id="loginForm" autocomplete="on">
        <div class="field">
          <label for="loginIdentifier">Username or email</label>
          <input
            id="loginIdentifier"
            name="username"
            type="text"
            placeholder="Enter your username or email"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            required
          >
        </div>

        <div class="field">
          <label for="loginPassword">Password</label>
          <div class="input-wrap">
            <input
              class="password-input"
              id="loginPassword"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button class="show-password" type="button" data-password="loginPassword">Show</button>
          </div>
        </div>

        <button class="primary-button" type="submit">Log in</button>
        <p class="message" id="loginMessage" role="status" aria-live="polite"></p>
      </form>

      <p class="switch">
        Don't have an account?
        <button class="text-button" type="button" id="openSignup">Create account</button>
      </p>
    </section>

    <section id="signupScreen" hidden>
      <h1>Create account</h1>
      <p class="subtitle">Get started with Celio</p>

      <form id="signupForm" autocomplete="on">
        <div class="field">
          <label for="signupUsername">Username</label>
          <input
            id="signupUsername"
            name="username"
            type="text"
            placeholder="Choose a username"
            autocomplete="username"
            autocapitalize="none"
            spellcheck="false"
            minlength="3"
            maxlength="24"
            required
          >
        </div>

        <div class="field">
          <label for="signupEmail">Email address</label>
          <input
            id="signupEmail"
            name="email"
            type="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          >
        </div>

        <div class="field">
          <label for="signupPassword">Password</label>
          <div class="input-wrap">
            <input
              class="password-input"
              id="signupPassword"
              name="new-password"
              type="password"
              placeholder="Create a password"
              autocomplete="new-password"
              minlength="8"
              required
            >
            <button class="show-password" type="button" data-password="signupPassword">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <input
            id="confirmPassword"
            name="confirm-password"
            type="password"
            placeholder="Enter your password again"
            autocomplete="new-password"
            minlength="8"
            required
          >
        </div>

        <button class="primary-button" type="submit">Create account</button>
        <p class="message" id="signupMessage" role="status" aria-live="polite"></p>
      </form>

      <p class="switch">
        Already have an account?
        <button class="text-button" type="button" id="openLogin">Log in</button>
      </p>
    </section>
  </main>

  <script>
    const loginScreen = document.getElementById("loginScreen");
    const signupScreen = document.getElementById("signupScreen");

    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");

    const loginMessage = document.getElementById("loginMessage");
    const signupMessage = document.getElementById("signupMessage");

    function showScreen(screen) {
      const showSignup = screen === "signup";

      loginScreen.hidden = showSignup;
      signupScreen.hidden = !showSignup;

      loginMessage.textContent = "";
      signupMessage.textContent = "";

      document.title = showSignup ? "Create account | Celio" : "Login | Celio";

      const heading = (showSignup ? signupScreen : loginScreen).querySelector("h1");
      heading.setAttribute("tabindex", "-1");
      heading.focus();
    }

    document.getElementById("openSignup").addEventListener("click", () => {
      showScreen("signup");
    });

    document.getElementById("openLogin").addEventListener("click", () => {
      showScreen("login");
    });

    document.querySelectorAll("[data-password]").forEach(button => {
      button.addEventListener("click", () => {
        const input = document.getElementById(button.dataset.password);
        const showing = input.type === "password";

        input.type = showing ? "text" : "password";
        button.textContent = showing ? "Hide" : "Show";
        button.setAttribute("aria-pressed", String(showing));
      });
    });

    loginForm.addEventListener("submit", event => {
      event.preventDefault();

      if (!loginForm.reportValidity()) return;

      loginMessage.style.color = "#929292";
      loginMessage.textContent = "Login will work once Firebase is connected.";
    });

    signupForm.addEventListener("submit", event => {
      event.preventDefault();

      if (!signupForm.reportValidity()) return;

      const password = document.getElementById("signupPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        signupMessage.style.color = "#f08c8c";
        signupMessage.textContent = "Passwords do not match.";
        return;
      }

      signupMessage.style.color = "#929292";
      signupMessage.textContent = "Account creation will work once Firebase is connected.";
    });

    [loginForm, signupForm].forEach(form => {
      form.addEventListener("input", () => {
        const message = form === loginForm ? loginMessage : signupMessage;
        message.textContent = "";
      });
    });
  </script>
</body>
</html>
